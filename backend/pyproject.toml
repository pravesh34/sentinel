[project]
name = "sentinel-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30", "pydantic>=2.9,<3", "pydantic-settings>=2.5",
  "sqlalchemy>=2.0,<3", "python-jose[cryptography]>=3.3", "passlib[bcrypt]>=1.7", "bcrypt==4.0.1",
  "cryptography>=43", "httpx>=0.27", "langgraph>=0.2,<0.3", "langchain-core>=0.3",
  "langsmith>=0.1", "redis>=5", "python-dotenv>=1", "slowapi>=0.1",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "alembic>=1.13"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 100
